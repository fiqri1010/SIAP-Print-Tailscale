[package]
name = "siap-print-tailscale"
version = "1.3.0"
description = "SIAP Print Tailscale Server for Bea Cukai Tanjung Priok"
authors = ["SIAP NEO Team"]
edition = "2024"

[lib]
name = "siap_print_tailscale_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
